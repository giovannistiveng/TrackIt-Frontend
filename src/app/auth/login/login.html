<div class="login-container">
  <div class="login-box">
    <h2>TrackIt Express</h2>
    <p>Inicia sesión en tu cuenta</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <input id="correo" type="email" formControlName="correo" placeholder="ejemplo@trackit.com">
        <span class="error" *ngIf="loginForm.get('correo')?.invalid && loginForm.get('correo')?.touched">
          Ingresa un correo válido.
        </span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="********">
        <span class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Mínimo 8 caracteres.
        </span>
      </div>

      <button type="submit" [disabled]="loginForm.invalid">Ingresar</button>
      
    </form>
  </div>
</div>
